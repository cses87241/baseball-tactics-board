<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>棒球戰術板 | Baseball Tactics Board</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
  background: #4a5a3a;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}
#header {
  background: #2c3e2c;
  color: #fff;
  padding: 10px 20px;
  text-align: center;
  font-size: 1.2rem;
  font-weight: bold;
}
#board-container {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
  overflow: auto;
  background: #5a6a4a;
}
#field {
  position: relative;
  width: 900px;
  height: 680px;
  background: #228B22;
  border: 4px solid #1a3a1a;
  box-shadow: 0 0 20px rgba(0,0,0,0.4);
  flex-shrink: 0;
}
.marker {
  position: absolute;
  cursor: grab;
  user-select: none;
  z-index: 10;
}
.marker:active { cursor: grabbing; }
.marker .circle {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 3px solid #222;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 14px;
  color: #fff;
  text-shadow: 1px 1px 2px #000;
  box-shadow: 0 2px 6px rgba(0,0,0,0.4);
}
.marker .pname {
  position: absolute;
  top: 42px;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  background: rgba(0,0,0,0.8);
  color: #fff;
  font-size: 16px;
  font-weight: bold;
  padding: 3px 10px;
  border-radius: 4px;
  pointer-events: none;
  text-align: center;
  display: none;
  box-shadow: 0 1px 4px rgba(0,0,0,0.5);
}
#toolbar {
  background: #2c2c2c;
  color: #eee;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  border-top: 3px solid #555;
}
.color-btn {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  cursor: pointer;
  border: 4px solid transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 13px;
  color: #fff;
  text-shadow: 1px 1px 1px #000;
  transition: transform 0.1s;
}
.color-btn:hover { transform: scale(1.1); }
.color-btn.selected {
  border-color: #fff;
  box-shadow: 0 0 0 2px #000;
}
button {
  padding: 8px 16px;
  font-size: 14px;
  cursor: pointer;
  background: #555;
  color: #fff;
  border: none;
  border-radius: 6px;
}
button:hover { background: #777; }
#hint {
  font-size: 13px;
  color: #aaa;
  margin-left: auto;
}
@media (max-width: 900px) {
  #field { width: 100%; height: auto; aspect-ratio: 900/680; }
  #hint { margin-left: 0; width: 100%; text-align: center; }
}
</style>
</head>
<body>
<div id="header">棒球戰術板 Baseball Tactics Board</div>
<div id="board-container">
  <div id="field">
    <svg width="100%" height="100%" viewBox="0 0 900 680" preserveAspectRatio="xMidYMid meet" style="position:absolute; top:0; left:0; pointer-events:none;">
      <!-- Outfield grass -->
      <rect width="900" height="680" fill="#228B22"/>
      <!-- Foul lines extended -->
      <line x1="450" y1="560" x2="80" y2="120" stroke="#ffffff" stroke-width="4"/>
      <line x1="450" y1="560" x2="820" y2="120" stroke="#ffffff" stroke-width="4"/>
      <!-- Outfield fence -->
      <path d="M80,120 Q450,20 820,120" stroke="#ffffff" fill="none" stroke-width="5"/>
      <!-- Infield dirt: square diamond -->
      <polygon points="450,560 550,460 450,360 350,460" fill="#C19A6B"/>
      <!-- Base paths -->
      <line x1="450" y1="560" x2="550" y2="460" stroke="#ffffff" stroke-width="3"/>
      <line x1="550" y1="460" x2="450" y2="360" stroke="#ffffff" stroke-width="3"/>
      <line x1="450" y1="360" x2="350" y2="460" stroke="#ffffff" stroke-width="3"/>
      <line x1="350" y1="460" x2="450" y2="560" stroke="#ffffff" stroke-width="3"/>
      <!-- Bases (squares) -->
      <rect x="542" y="452" width="16" height="16" fill="#ffffff" stroke="#333" transform="rotate(45 550 460)"/>
      <rect x="442" y="352" width="16" height="16" fill="#ffffff" stroke="#333" transform="rotate(45 450 360)"/>
      <rect x="342" y="452" width="16" height="16" fill="#ffffff" stroke="#333" transform="rotate(45 350 460)"/>
      <!-- Home plate area: red mat like 樂樂棒 -->
      <rect x="380" y="530" width="140" height="90" fill="#c0392b" stroke="#ffffff" stroke-width="4"/>
      <line x1="380" y1="575" x2="520" y2="575" stroke="#ffffff" stroke-width="2"/>
      <!-- Home plate pentagon -->
      <polygon points="450,555 465,570 450,585 435,570 450,540" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
      <!-- Tee -->
      <circle cx="450" cy="568" r="4" fill="#222"/>
      <line x1="450" y1="568" x2="450" y2="548" stroke="#222" stroke-width="3"/>
      <!-- Pitcher's area -->
      <circle cx="450" cy="460" r="28" fill="#D2B48C" stroke="#fff" stroke-width="2"/>
      <circle cx="450" cy="460" r="5" fill="#ffffff"/>
      <!-- 5m dashed lines (不可折返線) from 1st, 2nd, 3rd -->
      <line x1="520" y1="430" x2="535" y2="445" stroke="#ffffff" stroke-width="2" stroke-dasharray="6,4"/>
      <line x1="515" y1="425" x2="540" y2="450" stroke="#ffffff" stroke-width="2" stroke-dasharray="6,4"/>
      <line x1="420" y1="330" x2="405" y2="345" stroke="#ffffff" stroke-width="2" stroke-dasharray="6,4"/>
      <line x1="425" y1="325" x2="400" y2="350" stroke="#ffffff" stroke-width="2" stroke-dasharray="6,4"/>
      <line x1="380" y1="490" x2="365" y2="505" stroke="#ffffff" stroke-width="2" stroke-dasharray="6,4"/>
      <line x1="385" y1="495" x2="360" y2="510" stroke="#ffffff" stroke-width="2" stroke-dasharray="6,4"/>
      <!-- 5m line in front of home -->
      <path d="M400,510 Q450,490 500,510" stroke="#ffffff" fill="none" stroke-width="2" stroke-dasharray="6,4"/>
    </svg>
  </div>
</div>
<div id="toolbar">
  <span style="font-weight:bold;">選擇顏色：</span>
  <div class="color-btn selected" style="background:#8B0000" data-color="#8B0000">1</div>
  <div class="color-btn" style="background:#FFD700" data-color="#FFD700">2</div>
  <div class="color-btn" style="background:#800080" data-color="#800080">3</div>
  <div class="color-btn" style="background:#32CD32" data-color="#32CD32">4</div>
  <div class="color-btn" style="background:#0000CD" data-color="#0000CD">5</div>
  <div class="color-btn" style="background:#FF0000" data-color="#FF0000">6</div>
  <div class="color-btn" style="background:#FF8C00" data-color="#FF8C00">7</div>
  <div class="color-btn" style="background:#00BFFF" data-color="#00BFFF">8</div>
  <div class="color-btn" style="background:#FFFFFF; color:#000; text-shadow:none;" data-color="#FFFFFF">9</div>
  <div class="color-btn" style="background:#000000" data-color="#000000">10</div>
  <button id="clear">清除全部標記</button>
  <div id="hint">點擊放置　|　拖曳移動　|　右鍵設定球員名稱　|　雙擊刪除</div>
</div>
<script>
const field = document.getElementById('field');
let selectedColor = '#8B0000';
let markerCount = 0;

document.querySelectorAll('.color-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedColor = btn.dataset.color;
  });
});

field.addEventListener('click', (e) => {
  if (e.target.closest('.marker')) return;
  const rect = field.getBoundingClientRect();
  const x = e.clientX - rect.left - 18;
  const y = e.clientY - rect.top - 18;
  placeMarker(x, y, selectedColor);
});

function placeMarker(x, y, color) {
  markerCount++;
  const marker = document.createElement('div');
  marker.className = 'marker';
  marker.style.left = Math.max(0, x) + 'px';
  marker.style.top = Math.max(0, y) + 'px';
  marker.dataset.num = markerCount;
  marker.dataset.color = color;
  marker.dataset.name = '';
  const textColor = (color === '#FFFFFF' || color === '#FFD700' || color === '#32CD32') ? '#000' : '#fff';
  const textShadow = (textColor === '#000') ? 'none' : '1px 1px 2px #000';
  marker.innerHTML = `<div class="circle" style="background:${color}; color:${textColor}; text-shadow:${textShadow}">${markerCount}</div><div class="pname"></div>`;
  field.appendChild(marker);
  makeDraggable(marker);

  marker.addEventListener('contextmenu', (ev) => {
    ev.preventDefault();
    const current = marker.dataset.name || '';
    const name = prompt('請輸入球員名稱：', current);
    if (name !== null) {
      const trimmed = name.trim();
      marker.dataset.name = trimmed;
      const pname = marker.querySelector('.pname');
      pname.textContent = trimmed;
      pname.style.display = trimmed ? 'block' : 'none';
    }
  });

  marker.addEventListener('dblclick', (ev) => {
    ev.preventDefault();
    marker.remove();
  });
}

function makeDraggable(el) {
  let isDragging = false;
  let offsetX = 0, offsetY = 0;

  el.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    isDragging = true;
    const rect = el.getBoundingClientRect();
    offsetX = e.clientX - rect.left;
    offsetY = e.clientY - rect.top;
    el.setPointerCapture(e.pointerId);
    el.style.zIndex = 100;
    e.stopPropagation();
  });

  el.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    const fieldRect = field.getBoundingClientRect();
    let x = e.clientX - fieldRect.left - offsetX;
    let y = e.clientY - fieldRect.top - offsetY;
    x = Math.max(0, Math.min(x, field.offsetWidth - 36));
    y = Math.max(0, Math.min(y, field.offsetHeight - 36));
    el.style.left = x + 'px';
    el.style.top = y + 'px';
  });

  el.addEventListener('pointerup', (e) => {
    isDragging = false;
    try { el.releasePointerCapture(e.pointerId); } catch(err) {}
    el.style.zIndex = 10;
  });
}

document.getElementById('clear').addEventListener('click', () => {
  document.querySelectorAll('.marker').forEach(m => m.remove());
  markerCount = 0;
});
</script>
</body>
</html>
