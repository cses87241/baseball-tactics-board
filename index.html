<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>棒球戰術板 | Baseball Tactics Board</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
  background: #4a5a3a;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}
#header {
  background: #2c3e2c;
  color: #fff;
  padding: 10px 20px;
  text-align: center;
  font-size: 1.2rem;
  font-weight: bold;
}
#board-container {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
  overflow: auto;
  background: #5a6a4a;
}
#field {
  position: relative;
  width: 900px;
  height: 680px;
  background: #228B22;
  border: 4px solid #1a3a1a;
  box-shadow: 0 0 20px rgba(0,0,0,0.4);
  flex-shrink: 0;
}
.marker {
  position: absolute;
  cursor: grab;
  user-select: none;
  z-index: 10;
}
.marker:active { cursor: grabbing; }
.marker .circle {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 3px solid #222;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 14px;
  color: #fff;
  text-shadow: 1px 1px 2px #000;
  box-shadow: 0 2px 6px rgba(0,0,0,0.4);
}
.marker .pname {
  position: absolute;
  top: 42px;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  background: rgba(0,0,0,0.8);
  color: #fff;
  font-size: 16px;
  font-weight: bold;
  padding: 3px 10px;
  border-radius: 4px;
  pointer-events: none;
  text-align: center;
  display: none;
  box-shadow: 0 1px 4px rgba(0,0,0,0.5);
}
.tool-item {
  position: absolute;
  cursor: grab;
  user-select: none;
  z-index: 10;
}
.tool-item:active { cursor: grabbing; }
#toolbar {
  background: #2c2c2c;
  color: #eee;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  border-top: 3px solid #555;
}
.color-btn, .tool-btn {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  cursor: pointer;
  border: 4px solid transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 13px;
  color: #fff;
  text-shadow: 1px 1px 1px #000;
  transition: transform 0.1s;
  background: #444;
}
.tool-btn { border-radius: 6px; font-size: 20px; }
.color-btn:hover, .tool-btn:hover { transform: scale(1.1); }
.color-btn.selected, .tool-btn.selected {
  border-color: #fff;
  box-shadow: 0 0 0 2px #000;
}
button {
  padding: 8px 16px;
  font-size: 14px;
  cursor: pointer;
  background: #555;
  color: #fff;
  border: none;
  border-radius: 6px;
}
button:hover { background: #777; }
#hint {
  font-size: 13px;
  color: #aaa;
  margin-left: auto;
}
@media (max-width: 900px) {
  #field { width: 100%; height: auto; aspect-ratio: 900/680; }
  #hint { margin-left: 0; width: 100%; text-align: center; }
}
</style>
</head>
<body>
<div id="header">棒球戰術板 Baseball Tactics Board</div>
<div id="board-container">
  <div id="field">
    <svg width="100%" height="100%" viewBox="0 0 900 680" preserveAspectRatio="xMidYMid meet" style="position:absolute; top:0; left:0; pointer-events:none;">
      <!-- Outfield grass -->
      <rect width="900" height="680" fill="#228B22"/>
      <!-- Foul lines -->
      <line x1="450" y1="580" x2="40" y2="160" stroke="#ffffff" stroke-width="4"/>
      <line x1="450" y1="580" x2="860" y2="160" stroke="#ffffff" stroke-width="4"/>
      <!-- Outfield fence (curved) -->
      <path d="M40,160 Q450,30 860,160" stroke="#ffffff" fill="none" stroke-width="5"/>
      <!-- Infield dirt -->
      <path d="M450,580 L620,410 L450,240 L280,410 Z" fill="#C19A6B"/>
      <path d="M280,410 Q450,200 620,410" fill="#C19A6B" stroke="#C19A6B"/>
      <!-- Grass cut in infield -->
      <path d="M450,520 L550,420 L450,320 L350,420 Z" fill="#228B22"/>
      <!-- Bases -->
      <rect x="590" y="385" width="16" height="16" fill="#ffffff" stroke="#333" stroke-width="1" transform="rotate(45 598 393)"/>
      <rect x="602" y="397" width="16" height="16" fill="#e67e22" stroke="#333" stroke-width="1" transform="rotate(45 610 405)"/>
      <rect x="448" y="234" width="16" height="16" fill="#e67e22" stroke="#333" stroke-width="1" transform="rotate(45 456 242)"/>
      <rect x="436" y="246" width="16" height="16" fill="#ffffff" stroke="#333" stroke-width="1" transform="rotate(45 444 254)"/>
      <rect x="278" y="402" width="16" height="16" fill="#e67e22" stroke="#333" stroke-width="1" transform="rotate(45 286 410)"/>
      <rect x="290" y="414" width="16" height="16" fill="#ffffff" stroke="#333" stroke-width="1" transform="rotate(45 298 422)"/>
      <!-- Home plate -->
      <rect x="430" y="590" width="40" height="28" fill="#e67e22" stroke="#333" stroke-width="1"/>
      <rect x="432" y="575" width="36" height="22" fill="#ffffff" stroke="#333" stroke-width="1"/>
      <polygon points="450,560 468,575 450,590 432,575 450,548" fill="#ffffff" stroke="#333" stroke-width="1"/>
      <!-- Pitcher's mound -->
      <circle cx="450" cy="410" r="32" fill="#D2B48C" stroke="#fff" stroke-width="2"/>
      <circle cx="450" cy="410" r="6" fill="#ffffff"/>
      <!-- Home plate area dirt -->
      <circle cx="450" cy="580" r="45" fill="#C19A6B"/>
      <!-- Batter boxes -->
      <rect x="400" y="550" width="20" height="40" fill="none" stroke="#fff" stroke-width="2"/>
      <rect x="480" y="550" width="20" height="40" fill="none" stroke="#fff" stroke-width="2"/>
      <!-- On-deck circles -->
      <circle cx="300" cy="620" r="18" fill="none" stroke="#fff" stroke-width="2"/>
      <circle cx="600" cy="620" r="18" fill="none" stroke="#fff" stroke-width="2"/>
    </svg>
  </div>
</div>
<div id="toolbar">
  <span style="font-weight:bold;">選擇工具：</span>
  <div class="color-btn selected" style="background:#8B0000" data-type="color" data-color="#8B0000">1</div>
  <div class="color-btn" style="background:#FFD700" data-type="color" data-color="#FFD700">2</div>
  <div class="color-btn" style="background:#800080" data-type="color" data-color="#800080">3</div>
  <div class="color-btn" style="background:#32CD32" data-type="color" data-color="#32CD32">4</div>
  <div class="color-btn" style="background:#0000CD" data-type="color" data-color="#0000CD">5</div>
  <div class="color-btn" style="background:#FF0000" data-type="color" data-color="#FF0000">6</div>
  <div class="color-btn" style="background:#FF8C00" data-type="color" data-color="#FF8C00">7</div>
  <div class="color-btn" style="background:#00BFFF" data-type="color" data-color="#00BFFF">8</div>
  <div class="color-btn" style="background:#FFFFFF; color:#000; text-shadow:none;" data-type="color" data-color="#FFFFFF">9</div>
  <div class="color-btn" style="background:#000000" data-type="color" data-color="#000000">10</div>
  <div class="tool-btn" data-type="cross" title="紅色打叉">✖</div>
  <div class="tool-btn" data-type="arrow" title="黑色箭頭（拖曳畫）">→</div>
  <button id="clear">清除全部標記</button>
  <div id="hint">點擊放置　|　箭頭拖曳畫線　|　拖曳移動　|　右鍵設定名稱　|　雙擊刪除</div>
</div>
<script>
const field = document.getElementById('field');
let selectedType = 'color';
let selectedColor = '#8B0000';
let markerCount = 0;
let isDrawingArrow = false;
let arrowStart = null;
let tempArrow = null;

document.querySelectorAll('.color-btn, .tool-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.color-btn, .tool-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedType = btn.dataset.type;
    if (selectedType === 'color') selectedColor = btn.dataset.color;
  });
});

field.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  if (e.target.closest('.marker') || e.target.closest('.tool-item')) return;
  const rect = field.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  if (selectedType === 'color') {
    placeMarker(x - 18, y - 18, selectedColor);
  } else if (selectedType === 'cross') {
    placeCross(x - 16, y - 16);
  } else if (selectedType === 'arrow') {
    isDrawingArrow = true;
    arrowStart = { x, y };
    tempArrow = document.createElement('div');
    tempArrow.className = 'tool-item';
    tempArrow.style.pointerEvents = 'none';
    tempArrow.style.zIndex = '20';
    field.appendChild(tempArrow);
    updateTempArrow(x, y);
    e.preventDefault();
  }
});

field.addEventListener('pointermove', (e) => {
  if (!isDrawingArrow || !arrowStart) return;
  const rect = field.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  updateTempArrow(x, y);
});

field.addEventListener('pointerup', (e) => {
  if (!isDrawingArrow || !arrowStart) return;
  const rect = field.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  finalizeArrow(arrowStart.x, arrowStart.y, x, y);
  if (tempArrow) tempArrow.remove();
  isDrawingArrow = false;
  arrowStart = null;
  tempArrow = null;
});

function updateTempArrow(endX, endY) {
  if (!tempArrow || !arrowStart) return;
  const dx = endX - arrowStart.x;
  const dy = endY - arrowStart.y;
  const length = Math.hypot(dx, dy);
  const angle = Math.atan2(dy, dx) * 180 / Math.PI;
  tempArrow.style.left = arrowStart.x + 'px';
  tempArrow.style.top = (arrowStart.y - 4) + 'px';
  tempArrow.style.width = length + 'px';
  tempArrow.style.height = '8px';
  tempArrow.style.transformOrigin = '0 50%';
  tempArrow.style.transform = `rotate(${angle}deg)`;
  tempArrow.innerHTML = `<svg width="${length}" height="8" viewBox="0 0 ${length} 8"><line x1="0" y1="4" x2="${length-10}" y2="4" stroke="#000" stroke-width="3"/><polygon points="${length-10},0 ${length},4 ${length-10},8" fill="#000"/></svg>`;
}

function finalizeArrow(x1, y1, x2, y2) {
  const dx = x2 - x1;
  const dy = y2 - y1;
  const length = Math.hypot(dx, dy);
  if (length < 10) return;
  const angle = Math.atan2(dy, dx) * 180 / Math.PI;
  const item = document.createElement('div');
  item.className = 'tool-item';
  item.style.left = x1 + 'px';
  item.style.top = (y1 - 4) + 'px';
  item.style.width = length + 'px';
  item.style.height = '8px';
  item.style.transformOrigin = '0 50%';
  item.style.transform = `rotate(${angle}deg)`;
  item.innerHTML = `<svg width="${length}" height="8" viewBox="0 0 ${length} 8"><line x1="0" y1="4" x2="${length-10}" y2="4" stroke="#000" stroke-width="3"/><polygon points="${length-10},0 ${length},4 ${length-10},8" fill="#000"/></svg>`;
  field.appendChild(item);
  makeDraggable(item);
  item.addEventListener('dblclick', (ev) => {
    ev.preventDefault();
    item.remove();
  });
}

function placeMarker(x, y, color) {
  markerCount++;
  const marker = document.createElement('div');
  marker.className = 'marker';
  marker.style.left = Math.max(0, x) + 'px';
  marker.style.top = Math.max(0, y) + 'px';
  marker.dataset.num = markerCount;
  marker.dataset.color = color;
  marker.dataset.name = '';
  const textColor = (color === '#FFFFFF' || color === '#FFD700' || color === '#32CD32') ? '#000' : '#fff';
  const textShadow = (textColor === '#000') ? 'none' : '1px 1px 2px #000';
  marker.innerHTML = `<div class="circle" style="background:${color}; color:${textColor}; text-shadow:${textShadow}">${markerCount}</div><div class="pname"></div>`;
  field.appendChild(marker);
  makeDraggable(marker);
  marker.addEventListener('contextmenu', (ev) => {
    ev.preventDefault();
    const current = marker.dataset.name || '';
    const name = prompt('請輸入球員名稱：', current);
    if (name !== null) {
      const trimmed = name.trim();
      marker.dataset.name = trimmed;
      const pname = marker.querySelector('.pname');
      pname.textContent = trimmed;
      pname.style.display = trimmed ? 'block' : 'none';
    }
  });
  marker.addEventListener('dblclick', (ev) => {
    ev.preventDefault();
    marker.remove();
  });
}

function placeCross(x, y) {
  const item = document.createElement('div');
  item.className = 'tool-item';
  item.style.left = Math.max(0, x) + 'px';
  item.style.top = Math.max(0, y) + 'px';
  item.innerHTML = `<div style="width:32px;height:32px;color:#e74c3c;font-size:32px;font-weight:bold;line-height:1;text-shadow:1px 1px 2px #000;">✖</div>`;
  field.appendChild(item);
  makeDraggable(item);
  item.addEventListener('dblclick', (ev) => {
    ev.preventDefault();
    item.remove();
  });
}

function makeDraggable(el) {
  let isDragging = false;
  let offsetX = 0, offsetY = 0;
  el.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    isDragging = true;
    const rect = el.getBoundingClientRect();
    offsetX = e.clientX - rect.left;
    offsetY = e.clientY - rect.top;
    el.setPointerCapture(e.pointerId);
    el.style.zIndex = 100;
    e.stopPropagation();
  });
  el.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    const fieldRect = field.getBoundingClientRect();
    let x = e.clientX - fieldRect.left - offsetX;
    let y = e.clientY - fieldRect.top - offsetY;
    x = Math.max(0, Math.min(x, field.offsetWidth - 40));
    y = Math.max(0, Math.min(y, field.offsetHeight - 40));
    el.style.left = x + 'px';
    el.style.top = y + 'px';
  });
  el.addEventListener('pointerup', (e) => {
    isDragging = false;
    try { el.releasePointerCapture(e.pointerId); } catch(err) {}
    el.style.zIndex = 10;
  });
}

document.getElementById('clear').addEventListener('click', () => {
  document.querySelectorAll('.marker, .tool-item').forEach(m => m.remove());
  markerCount = 0;
});
</script>
</body>
</html>
